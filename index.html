<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>🍉 Frutitas</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f1a;
        }
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            z-index: 10;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }
        #score-block { text-align: center; }
        #score-label { font-size: 11px; opacity: 0.6; text-transform: uppercase; }
        #score { font-size: 28px; }
        #best-block { text-align: right; }
        #best-label { font-size: 11px; opacity: 0.6; text-transform: uppercase; }
        #best { font-size: 18px; }
        #next-block { text-align: left; }
        #next-label { font-size: 11px; opacity: 0.6; text-transform: uppercase; }
        #next-fruit { font-size: 28px; }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
        }
        #game-over.show { display: flex; }
        #game-over h2 { font-size: 32px; margin-bottom: 8px; }
        #game-over p { font-size: 16px; opacity: 0.8; margin-bottom: 24px; }
        #final-score { font-size: 48px; font-weight: bold; }
        #final-label { font-size: 14px; opacity: 0.6; text-transform: uppercase; margin-bottom: 24px; }
        button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div id="next-block">
                <div id="next-label">Siguiente</div>
                <div id="next-fruit">🍒</div>
            </div>
            <div id="score-block">
                <div id="score-label">Puntos</div>
                <div id="score">0</div>
            </div>
            <div id="best-block">
                <div id="best-label">Récord</div>
                <div id="best">0</div>
            </div>
        </div>
        <canvas id="game"></canvas>
        <div id="game-over">
            <h2>¡Game Over! 🍉</h2>
            <p>Las frutas llegaron al tope</p>
            <div id="final-label">Puntuación final</div>
            <div id="final-score">0</div>
            <button id="restart-btn">Jugar de nuevo</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <script src="game.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
